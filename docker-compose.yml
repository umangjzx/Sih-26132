services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: harvestiq
      POSTGRES_PASSWORD: harvestiq
      POSTGRES_DB: harvestiq
    ports:
      - "5433:5432"
    volumes:
      - harvestiq_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harvestiq"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  harvestiq_pgdata:
