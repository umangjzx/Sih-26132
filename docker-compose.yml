services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: agrilink
      POSTGRES_PASSWORD: agrilink
      POSTGRES_DB: agrilink
    ports:
      - "5433:5432"
    volumes:
      - agrilink_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agrilink"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  agrilink_pgdata:
